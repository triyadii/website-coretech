<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="prismGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="coreInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="100" height="100" rx="22" fill="url(#bgGlow)"/>
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(167, 139, 250, 0.3)" stroke-width="1.5"/>

  <!-- Outer Hexagonal Frame -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke="url(#prismGradient)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Inverted Intersecting Star / Geometric Layers -->
  <polygon points="50,22 75,65 25,65" fill="none" stroke="rgba(56, 189, 248, 0.75)" stroke-width="1.8"/>
  <polygon points="50,78 25,35 75,35" fill="none" stroke="rgba(192, 132, 252, 0.75)" stroke-width="1.8"/>

  <!-- Inner Hexagon Crystal Core -->
  <polygon points="50,34 66,43 66,57 50,66 34,57 34,43" fill="url(#coreInner)" opacity="0.88"/>
  <polygon points="50,34 66,43 66,57 50,66 34,57 34,43" fill="none" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Facet lines -->
  <line x1="50" y1="34" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="66" y1="43" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="66" y1="57" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="50" y1="66" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="34" y1="57" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="34" y1="43" x2="50" y2="50" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

  <!-- Center brilliant light point -->
  <circle cx="50" cy="50" r="2.8" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
